<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>SCANTY MD BOT</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 18px;
    }
    h1 { text-align: center; letter-spacing: 2px; }
    .accent { color: #ff3155; }
    p { color: #aaa; text-align: center; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      background: #09090d;
      border: 1px solid #353541;
      color: white;
    }
    button {
      border: 0;
      background: #ff3155;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #292936; }
    #message { min-height: 24px; font-size: 14px; }
    #dashboard { display: none; }
  </style>
</head>

<body>
  <main class="card">
    <h1>SCANTY <span class="accent">MD BOT</span></h1>
    <p>Your personal WhatsApp bot dashboard</p>

    <section id="auth">
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button onclick="register()">Create Account</button>
      <button class="secondary" onclick="login()">Login</button>
      <p id="message"></p>
    </section>

    <section id="dashboard">
      <h2>Welcome!</h2>
      <p id="account"></p>
      <p>Your private dashboard is ready.</p>
      <button class="secondary" onclick="logout()">Logout</button>
    </section>
  </main>

  <script>
    const API = 'https://scanty-md-bot.onrender.com';

    const message = document.getElementById('message');

    async function request(path, body) {
      const response = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'Request failed');

      return data;
    }

    async function register() {
      await authenticate('/api/auth/register');
    }

    async function login() {
      await authenticate('/api/auth/login');
    }

    async function authenticate(path) {
      message.textContent = 'Please wait...';

      try {
        const data = await request(path, {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });

        sessionStorage.setItem('scanty_token', data.token);
        showDashboard(data.user.email);
      } catch (error) {
        message.textContent = error.message;
      }
    }

    function showDashboard(email) {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('account').textContent = email;
    }

    function logout() {
      sessionStorage.removeItem('scanty_token');
      location.reload();
    }
  </script>
</body>
</html>
