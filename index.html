<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANTY MD BOT - Connection Portal</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js CDN for rendering scannable QR images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
        <h1 class="text-2xl font-bold mb-1 text-center text-emerald-400">SCANTY MD BOT</h1>
        <p class="text-xs text-slate-400 mb-6 text-center">WhatsApp Session Authentication Portal</p>
        
        <!-- Status Banner -->
        <div id="status-box" class="mb-6 p-3 rounded-lg bg-slate-700/50 text-sm flex items-center justify-between border border-slate-600">
            <span>Status: <strong id="status-text" class="text-amber-400">Loading...</strong></span>
            <button onclick="checkStatus()" class="text-xs bg-slate-600 hover:bg-slate-500 px-2.5 py-1 rounded transition">Refresh</button>
        </div>

        <div class="space-y-6">
            <!-- Pairing Code Section -->
            <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                <h2 class="font-semibold text-emerald-300 mb-1 text-sm">📱 Pair with Phone Number</h2>
                <p class="text-xs text-slate-400 mb-3">Enter number with country code (e.g., 233...):</p>
                <input type="text" id="phone-input" placeholder="233500000000" class="w-full bg-slate-800 border border-slate-700 rounded p-2 mb-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="requestPairingCode(event)" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-2 rounded text-sm transition">Get Pairing Code</button>
                
                <div id="pairing-result" class="mt-3 hidden text-center p-3 bg-emerald-950/60 border border-emerald-800 rounded">
                    <p class="text-xs text-emerald-300">Your 8-Digit Pairing Code:</p>
                    <p id="pairing-code-display" class="text-2xl font-mono font-bold text-white tracking-widest mt-1 select-all"></p>
                </div>
            </div>

            <!-- QR Code Section -->
            <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700 text-center">
                <h2 class="font-semibold text-emerald-300 mb-1 text-sm text-left">📷 Scan QR Code</h2>
                <p class="text-xs text-slate-400 mb-3 text-left">Open WhatsApp > Linked Devices > Link a Device:</p>
                
                <div class="flex justify-center my-2">
                    <div id="qrcode" class="bg-white p-3 rounded-lg min-h-[180px] min-w-[180px] flex items-center justify-center text-slate-900 text-xs">Loading QR...</div>
                </div>
                
                <button onclick="fetchQRCode()" class="mt-2 text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">Reload QR Code</button>
            </div>
        </div>
    </div>

    <script>
        // Set API_BASE to your Render backend URL if hosted separately, 
        // or leave blank ("") if you serve this file directly from Express.
        const API_BASE = ""; 

        async function checkStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/status`);
                const data = await res.json();
                const statusEl = document.getElementById('status-text');
                statusEl.textContent = data.connectionStatus;
                
                if (data.connectionStatus === 'connected') {
                    statusEl.className = 'text-emerald-400 font-bold';
                } else if (data.connectionStatus === 'qr_ready') {
                    statusEl.className = 'text-amber-400 font-bold';
                } else {
                    statusEl.className = 'text-red-400 font-bold';
                }
            } catch (e) {
                document.getElementById('status-text').textContent = 'API Offline';
                document.getElementById('status-text').className = 'text-red-400 font-bold';
            }
        }

        async function requestPairingCode(event) {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                alert('Please enter a valid phone number.');
                return;
            }
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Generating...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/visitor/pairing?phone=${phone}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('pairing-result').classList.remove('hidden');
                    document.getElementById('pairing-code-display').textContent = data.pairingCode;
                } else {
                    alert(data.error || 'Failed to generate pairing code.');
                }
            } catch (e) {
                alert('Error connecting to backend API.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function fetchQRCode() {
            try {
                const res = await fetch(`${API_BASE}/api/visitor/qr-payload`);
                const data = await res.json();
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                
                if (data.success && data.qrPayload) {
                    new QRCode(qrContainer, {
                        text: data.qrPayload,
                        width: 170,
                        height: 170
                    });
                } else {
                    qrContainer.innerHTML = '<span class="text-slate-500">QR not ready yet.<br>Click reload in 5s.</span>';
                }
            } catch (e) {
                document.getElementById('qrcode').innerHTML = '<span class="text-red-400">Failed to load QR</span>';
            }
        }

        // Initialize and poll status
        checkStatus();
        fetchQRCode();
        setInterval(checkStatus, 10000); // Check status every 10 seconds
    </script>
</body>
</html>
